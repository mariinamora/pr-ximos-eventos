<style>
:root{--navy:#1d1a3c;--navy2:#2b2757;--blue:#93c0e3;--blue-d:#6aa3d0;--sky:#e8f2fa;--ink:#2a2748;--mut:#55527a;--past:#6b6990;--r:20px;--gap:18px;--g:clamp(16px,4vw,32px);--ease:cubic-bezier(.2,.7,.2,1)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.6 'Open Sans',system-ui,Arial,sans-serif;overflow-x:hidden}
h2,h3,p,ul{margin:0;padding:0}ul{list-style:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue-d);outline-offset:3px}

.ev-sec{width:100%;max-width:1200px;margin:0 auto;padding:clamp(20px,4vw,40px) var(--g)}
.ev-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px 24px;margin-bottom:20px}
.ev-head h2{font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.15;color:var(--navy)}
.ev-head h2::after{content:"";display:block;width:64px;height:5px;border-radius:5px;background:var(--blue);margin-top:10px}
.ev-mes{margin-top:10px;color:var(--mut);font-weight:600}

/* controles */
.ev-ui{display:flex;align-items:center;gap:10px}
.prog{width:clamp(56px,12vw,110px);height:4px;border-radius:4px;background:var(--sky);position:relative;overflow:hidden;margin-right:6px}
.prog i{position:absolute;top:0;bottom:0;left:0;width:50%;border-radius:4px;background:var(--navy);transition:left .3s var(--ease),width .3s var(--ease)}
.cb{width:46px;height:46px;border-radius:50%;border:2px solid var(--navy);background:transparent;color:var(--navy);display:grid;place-items:center;padding:0;cursor:pointer;transition:background .25s,color .25s,transform .25s var(--ease)}
.cb:hover{background:var(--navy);color:var(--blue);transform:scale(1.07)}
.cb:active{transform:scale(.96)}

/* carrusel */
.ev-track{position:relative;display:flex;gap:var(--gap);overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:6px 6px 26px;margin:-6px -6px -10px;scroll-padding-inline:6px}
.ev-track::-webkit-scrollbar{display:none}
.ev{flex:0 0 clamp(252px,78vw,312px);scroll-snap-align:start;display:flex}
.ev article{display:flex;flex-direction:column;width:100%;overflow:hidden;background:#fff;border:2px solid var(--sky);border-radius:var(--r);transition:transform .35s var(--ease),box-shadow .35s,border-color .35s;animation:ev-in .7s var(--ease) backwards;animation-delay:calc(var(--i,0)*70ms)}
.ev article:hover{transform:translateY(-6px);border-color:var(--blue);box-shadow:0 18px 34px rgba(147,192,227,.45)}
@keyframes ev-in{from{opacity:0;transform:translateY(16px)}}

.ev-date{position:relative;display:flex;align-items:center;gap:14px;padding:20px 22px;color:#fff;background:linear-gradient(120deg,var(--navy),var(--navy2));overflow:hidden}
.ev-date::after{content:"";position:absolute;right:-34px;top:-44px;width:120px;height:120px;border-radius:50%;background:var(--blue);opacity:.16}
.dd{position:relative;z-index:1;font-weight:800;font-size:3.8rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rng .dd{font-size:2.5rem}
.rest{position:relative;z-index:1;display:flex;flex-direction:column;min-width:0;flex:0 1 auto}
.mm{font-weight:700;font-size:1.15rem;line-height:1.2;color:var(--blue)}
.wd{font-size:.9rem;line-height:1.3;color:#dbe9f5}
.next .ev-date{background:var(--blue);color:var(--navy)}
.next .ev-date::after{background:#fff;opacity:.35}
.next .mm{color:var(--navy)}.next .wd{color:var(--navy2)}
.next article{border-color:var(--blue)}
.past .ev-date{background:var(--past)}
.past .mm{color:#fff}
.ev-ico{position:relative;z-index:1;flex:none;margin-left:auto;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--blue);background:rgba(255,255,255,.1);border:1.5px solid rgba(147,192,227,.55);transition:transform .45s var(--ease),background .3s}
.ev-ico svg{width:28px;height:28px;display:block}
.ev article:hover .ev-ico{transform:rotate(-8deg) scale(1.08);background:rgba(255,255,255,.18)}
.next .ev-ico{color:var(--navy);background:rgba(255,255,255,.5);border-color:rgba(29,26,60,.35)}
.past .ev-ico{color:#fff;border-color:rgba(255,255,255,.45)}
@media(prefers-reduced-motion:reduce){.ev article:hover .ev-ico{transform:none}}

.ev-body{flex:1;display:flex;flex-direction:column;gap:10px;padding:18px 22px 24px}
.ev-meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;background:var(--sky);color:var(--navy);font-weight:700;font-size:.8rem;line-height:1.5}
.chip.st{background:var(--navy);color:#fff}
.past .chip.st{background:transparent;color:var(--mut);border:1.5px solid var(--sky);padding:1.5px 10.5px}
.ev h3{font-weight:800;font-size:1.2rem;line-height:1.3;color:var(--navy);text-wrap:balance}
.ev-desc{color:var(--mut);font-size:.94rem;line-height:1.6}

/* mes sin eventos */
.ev-empty{position:relative;overflow:hidden;display:flex;align-items:center;gap:clamp(18px,4vw,36px);padding:clamp(28px,6vw,60px);border-radius:24px;color:#fff;background:linear-gradient(120deg,var(--navy),var(--navy2),#2d3f7a)}
.ev-empty::after{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:var(--blue);opacity:.16}
.ev-empty svg{position:relative;z-index:1;flex:none;width:clamp(48px,8vw,72px);height:auto}
.ev-empty div{position:relative;z-index:1;min-width:0}
.ev-empty h3{font-weight:800;font-size:clamp(1.35rem,3.2vw,2.1rem);line-height:1.2;text-wrap:balance}
.ev-empty p{margin-top:8px;color:#dbe9f5;max-width:46ch}
@media(max-width:520px){.ev-empty{flex-direction:column;align-items:flex-start}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

    infinito:'<path d="M12 12c-2-2.5-3.5-4-5.5-4a4 4 0 0 0 0 8c2 0 3.5-1.5 5.5-4zm0 0c2 2.5 3.5 4 5.5 4a4 4 0 0 0 0-8c-2 0-3.5 1.5-5.5 4z"/>',
    escudo:'<path d="M12 3l8 3v5.5c0 4.5-3.2 8.2-8 9.5-4.8-1.3-8-5-8-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
    familia:'<path d="M3.5 11L12 4l8.5 7M5.5 9.5V20h13V9.5"/><path d="M12 17s-3-1.8-3-3.8a1.8 1.8 0 0 1 3-1.2 1.8 1.8 0 0 1 3 1.2c0 2-3 3.8-3 3.8z"/>',
    hoja:'<path d="M20 4C10 4 4.5 9 4.5 15c0 1.8.3 3.2.8 4.5C6.5 20.5 8 21 9.5 21 16 21 20.5 16 20 4z"/><path d="M4.5 20.5C8 15 11.5 11.5 16 9"/>',
    columnas:'<path d="M3 9.5L12 4l9 5.5zM5.5 12v6.5M10 12v6.5M14 12v6.5M18.5 12v6.5M3.5 21h17"/>',
    europa:'<circle cx="12" cy="4.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="15.75" cy="5.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="18.5" cy="8.25" r="1.5" fill="currentColor" stroke="none"/><circle cx="19.5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="18.5" cy="15.75" r="1.5" fill="currentColor" stroke="none"/><circle cx="15.75" cy="18.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="8.25" cy="18.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="5.5" cy="15.75" r="1.5" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="5.5" cy="8.25" r="1.5" fill="currentColor" stroke="none"/><circle cx="8.25" cy="5.5" r="1.5" fill="currentColor" stroke="none"/>',
    graduacion:'<path d="M2.5 9.5L12 5l9.5 4.5L12 14z"/><path d="M6.5 11.7V16c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3v-4.3M21.5 9.5V15"/>',
    arbol:'<path d="M12 3l5 7h-3l4 6H6l4-6H7z"/><path d="M12 16v5"/>'
  };
  var AUTO = [
    [/halloween/, 'halloween'], [/flamenco/, 'abanico'], [/infancia/, 'globo'],
    [/cancion|musica/, 'nota'], [/ciencia/, 'ciencia'], [/\bpaz\b/, 'paz'],
    [/mujer|violencia/, 'mujer'], [/discapacidad/, 'personas'], [/lectura|libro/, 'libro'],
    [/salud/, 'salud'], [/alimentacion/, 'manzana'], [/empresa/, 'maletin'],
    [/carnaval/, 'mascara'], [/matematicas/, 'calculadora'], [/cultural/, 'paleta'],
    [/\bagua\b/, 'gota'], [/autismo/, 'infinito'], [/acoso/, 'escudo'], [/familia/, 'familia'],
    [/medio ambiente/, 'hoja'], [/memoria/, 'columnas'], [/europa/, 'europa'],
    [/bandera|constitucion|hispanidad|^dia de andalucia/, 'bandera'],
    [/navidad/, 'arbol'], [/fin de curso/, 'graduacion']
  ];
  function pickIcon(e) {
    if (e.i && ICONOS[e.i]) return e.i;
    var t = e.t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    for (var k = 0; k < AUTO.length; k++) if (AUTO[k][0].test(t)) return AUTO[k][1];
    return 'estrella';
  }
  function icon(name) {
    var s = el('span', 'ev-ico');
    s.setAttribute('aria-hidden', 'true');
    s.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICONOS[name] + '</svg>';
    return s;
  }

  /* Lee y valida el bloque EVENTOS; ignora (y avisa en consola) las líneas con errores */
  function load() {
    var src = (typeof EVENTOS !== 'undefined' && Array.isArray(EVENTOS)) ? EVENTOS : [], out = [];
    src.forEach(function (e, i) {
      var a = parse(e && e.fecha);
      if (!a || !e.titulo) { console.warn('Evento #' + (i + 1) + ' ignorado: revisa «fecha» (AAAA-MM-DD) y «titulo».'); return; }
      var b = e.hasta ? parse(e.hasta) : null;
      if (b && b <= a) b = null;
      out.push({ a: a, b: b, t: String(e.titulo), c: e.curso ? String(e.curso) : '', d: e.descripcion ? String(e.descripcion) : '', i: e.icono ? String(e.icono).trim().toLowerCase() : '' });
    });
    return out.sort(function (x, y) { return (x.a - y.a) || x.t.localeCompare(y.t, 'es'); });
  }

  function card(e, i, today, isNext) {
    var past = (e.b || e.a) < today;
    var li = el('li', 'ev' + (isNext ? ' next' : '') + (past ? ' past' : ''));
    li.style.setProperty('--i', i);
    var art = el('article');

    var t = el('time', 'ev-date' + (e.b ? ' rng' : ''));
    t.setAttribute('datetime', iso(e.a));
    t.appendChild(el('span', 'dd', e.b ? e.a.getDate() + '–' + e.b.getDate() : String(e.a.getDate())));
    var rest = el('span', 'rest');
    var sameMonth = !e.b || e.b.getMonth() === e.a.getMonth();
    rest.appendChild(el('span', 'mm', sameMonth ? MES[e.a.getMonth()] : MES[e.a.getMonth()].slice(0, 3) + ' – ' + MES[e.b.getMonth()].slice(0, 3)));
    rest.appendChild(el('span', 'wd', e.b ? DIA[e.a.getDay()] + ' a ' + DIA[e.b.getDay()] : DIA[e.a.getDay()]));
    t.appendChild(rest);
    t.appendChild(icon(pickIcon(e)));

    var body = el('div', 'ev-body'), meta = el('div', 'ev-meta');
    if (e.c) meta.appendChild(el('span', 'chip', e.c));
    if (isNext) meta.appendChild(el('span', 'chip st', 'Próximo'));
    else if (past) meta.appendChild(el('span', 'chip st', 'Celebrado'));
    if (meta.children.length) body.appendChild(meta);
    body.appendChild(el('h3', '', e.t));
    if (e.d) body.appendChild(el('p', 'ev-desc', e.d));

    art.appendChild(t); art.appendChild(body); li.appendChild(art);
    return li;
  }

  function over() { return track.scrollWidth > track.clientWidth + 4; }
  function sync() {
    var sw = track.scrollWidth;
    bar.style.width = Math.min(100, track.clientWidth / sw * 100) + '%';
    bar.style.left = (track.scrollLeft / sw * 100) + '%';
  }
  function fit() { ui.hidden = track.hidden || !over(); if (!ui.hidden) sync(); }

  /* Muestra solo los eventos del mes y año actuales del dispositivo */
  function render() {
    var now = new Date(), y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
    var key = y + '-' + m + '-' + d;
    if (key === lastKey) return;
    lastKey = key;
    var today = new Date(y, m, d);
    var list = load().filter(function (e) { return e.a.getFullYear() === y && e.a.getMonth() === m; });

    mesTxt.textContent = 'Actividades de ' + MES[m] + ' de ' + y;
    track.textContent = '';
    track.hidden = !list.length;
    empty.hidden = !!list.length;

    var next = -1;
    list.forEach(function (e, i) { if (next < 0 && (e.b || e.a) >= today) next = i; });
    list.forEach(function (e, i) { track.appendChild(card(e, i, today, i === next)); });

    track.scrollLeft = 0;
    requestAnimationFrame(function () {
      fit();
      if (next > 0 && over()) track.scrollLeft = track.children[next].offsetLeft - 6;
      if (!ui.hidden) sync();
      post();
    });
  }

  /* Navegación en bucle: al final vuelve al principio y al revés */
  function go(dir) {
    if (!over()) return;
    var step = track.firstElementChild.offsetWidth + (parseFloat(getComputedStyle(track).columnGap) || 18);
    var max = track.scrollWidth - track.clientWidth, x = track.scrollLeft, to;
    if (dir > 0) to = x >= max - 4 ? 0 : Math.min(max, x + step);
    else to = x <= 4 ? max : Math.max(0, x - step);
    track.scrollTo({ left: to, behavior: reduce ? 'auto' : 'smooth' });
  }
  $('#ev-prev').addEventListener('click', function () { go(-1); });
  $('#ev-next').addEventListener('click', function () { go(1); });
  track.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { go(1); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); }
  });
  track.addEventListener('scroll', function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(sync); }, { passive: true });

  /* Altura para el iframe (si la web contenedora la escucha) */
  function post() {
    if (window.parent === window) return;
    var h = document.body.offsetHeight;
    parent.postMessage({ ampaH: h, eventosH: h }, '*');
  }
  window.addEventListener('resize', function () { fit(); post(); });
  window.addEventListener('load', post);
  if (window.ResizeObserver) new ResizeObserver(post).observe(document.body);

  /* Cambio de mes automático, incluso con la página abierta */
  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
  setInterval(render, 60000);
  render();
})();
</script>
